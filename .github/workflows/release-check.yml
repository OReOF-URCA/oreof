name: Release check

# Vérification profonde, réservée aux releases minor/major (pas aux hotfix).
# - manuel : onglet Actions > Release check > Run workflow
# - hebdomadaire : lundi 02h UTC sur v2 (détecte la dérive avant la release)
# - appelable : le workflow de déploiement l'exécute avant toute release non-patch.
# NB : release-please crée sa PR avec GITHUB_TOKEN, ce qui ne déclenche pas de workflow
# `pull_request`. Pour lancer ce check automatiquement sur la PR de release, il faut un PAT
# ou une GitHub App dans release-please.yml (secret `RELEASE_PLEASE_TOKEN`).
on:
  workflow_dispatch:
  workflow_call:
  schedule:
    - cron: '0 2 * * 1'

concurrency:
  group: release-check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  php:
    name: PHP ${{ matrix.php }} (suite complète)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']

    services:
      db:
        image: mariadb:10.8
        env:
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      APP_ENV: test
      APP_SECRET: ci-secret-not-used-in-production
      DATABASE_URL: mysql://root:root@127.0.0.1:3306/oreof?serverVersion=mariadb-10.8.0&charset=utf8mb4

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: ctype, iconv, zip, intl, pdo_mysql, ldap, mbstring, xml, gd, fileinfo, libxml
          tools: composer:v2
          coverage: pcov

      - name: Composer install + audit
        run: |
          composer install --prefer-dist --no-progress --no-interaction --no-scripts
          composer audit --locked

      - name: Lint YAML / conteneur
        run: |
          php bin/console lint:yaml config translations --parse-tags
          php bin/console lint:container

      - name: Mapping Doctrine valide
        run: php bin/console doctrine:schema:validate --skip-sync

      - name: PHPStan (baseline)
        run: |
          APP_ENV=dev php bin/console cache:warmup
          php -d memory_limit=-1 vendor/bin/phpstan analyse -c phpstan.dist.neon --no-progress

      - name: PHPStan niveau 7 (informatif, mesure de la dette)
        continue-on-error: true
        run: php -d memory_limit=-1 vendor/bin/phpstan analyse -c phpstan.dist.neon --no-progress --level=7 --error-format=raw | wc -l

      - name: Base de test (schéma + fixtures)
        run: |
          php bin/console doctrine:database:create --if-not-exists
          php bin/console doctrine:schema:create --no-interaction
          php bin/console doctrine:fixtures:load --group=test --no-interaction

      # TODO : ajouter un seuil de couverture (voir docs/testing/README.md : 70 % min) une fois la
      # valeur actuelle mesurée ici, puis ne le faire que monter.
      - name: PHPUnit + couverture
        run: vendor/bin/phpunit --coverage-text --coverage-clover=coverage.xml

      - uses: actions/upload-artifact@v4
        with:
          name: coverage-php${{ matrix.php }}
          path: coverage.xml

  prod-build:
    name: Build de production (--no-dev, assets, cache:warmup prod)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: ctype, iconv, zip, intl, pdo_mysql, ldap, mbstring, xml, gd, fileinfo, libxml
          tools: composer:v2
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Composer sans dev + cache prod
        env:
          APP_ENV: prod
          APP_DEBUG: '0'
          APP_SECRET: ci-secret-not-used-in-production
          DATABASE_URL: mysql://root:root@127.0.0.1:3306/oreof?serverVersion=mariadb-10.8.0&charset=utf8mb4
        run: |
          composer install --no-dev --prefer-dist --optimize-autoloader --no-progress --no-interaction --no-scripts
          php bin/console cache:warmup

      - name: Assets
        run: |
          npm ci
          npm run build

      # source-map-js (high) signalé le 2026-10-07 : informatif jusqu'à `npm audit fix`, puis à rendre bloquant.
      - name: npm audit (informatif)
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high
