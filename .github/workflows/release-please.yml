name: Release Please

on:
  push:
    branches:
      - v2
      - main

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          target-branch: ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}

      # La branche de release n'existe que si une PR de release est ouverte (créée ou mise à jour
      # par ce run) : juste après son merge elle est supprimée et `git fetch` échouerait.
      - name: Set Release Please branch
        id: release-pr
        env:
          RELEASE_PR: ${{ steps.release.outputs.pr }}
        run: |
          if [ -z "$RELEASE_PR" ]; then
            echo "Aucune PR de release ouverte, rien à enrichir."
            exit 0
          fi
          branch="release-please--branches--${GITHUB_REF_NAME}"
          if git ls-remote --exit-code --heads origin "$branch" > /dev/null; then
            echo "branch=$branch" >> "$GITHUB_OUTPUT"
          else
            echo "Branche $branch absente, rien à enrichir."
          fi

      - name: Checkout Release Please branch
        if: steps.release-pr.outputs.branch != ''
        env:
          RELEASE_BRANCH: ${{ steps.release-pr.outputs.branch }}
        run: |
          git fetch origin "$RELEASE_BRANCH"
          git checkout -B "$RELEASE_BRANCH" "origin/$RELEASE_BRANCH"

      - name: Add GitHub authors to changelog
        if: steps.release-pr.outputs.branch != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/enrich-changelog-authors.py

      - name: Commit enriched changelog
        if: steps.release-pr.outputs.branch != ''
        env:
          RELEASE_BRANCH: ${{ steps.release-pr.outputs.branch }}
        run: |
          if git diff --quiet -- CHANGELOG.md; then
            echo "CHANGELOG.md already contains GitHub authors."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git commit -m "chore: add GitHub authors to changelog"
          git push origin "HEAD:$RELEASE_BRANCH"
