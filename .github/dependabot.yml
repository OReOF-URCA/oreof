version: 2
updates:
  - package-ecosystem: composer
    directory: /
    target-branch: v2-dev
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      symfony:
        patterns: ["symfony/*"]
  - package-ecosystem: npm
    directory: /
    target-branch: v2-dev
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    target-branch: v2-dev
    schedule:
      interval: monthly
