framework:
    messenger:
        failure_transport: failed

        transports:
            async_export:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                retry_strategy:
                    max_retries: 3
                    delay: 60000
                    multiplier: 2
                    max_delay: 900000
            failed: 'doctrine://default?queue_name=failed'

        routing:
            'App\Message\Export': async_export
            'App\Message\ChangeRfWorkflowNotification': async_export
            'App\Message\WorkflowEmailNotification': async_export

